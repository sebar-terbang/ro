<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F5F0E8;
  --surface: #FDFAF4;
  --surface2: #EDE8DE;
  --ink: #2A2118;
  --ink2: #6B5F4F;
  --ink3: #A89880;
  --accent: #4A7FA5;
  --accent-soft: #E8F2F9;
  --accent-mid: #B8D4E8;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 2.5rem 1.25rem 6rem;
  -webkit-tap-highlight-color: transparent;
}

.wrap { max-width: 480px; margin: 0 auto; }

header { margin-bottom: 2.5rem; }

.logo {
  font-family: 'Lora', serif;
  font-size: 1.4rem;
  font-weight: 400;
}
.logo em { font-style: italic; color: var(--ink2); }

.sub { font-size: 0.78rem; color: var(--ink3); margin-top: 4px; }

.top-bar {
  display: flex;
  align-items: center;
  margin-bottom: 2.5rem;
  gap: 1rem;
}

.prog-text { font-size: 0.8rem; color: var(--ink3); white-space: nowrap; }
.prog-text span { font-size: 1.05rem; font-weight: 500; color: var(--ink2); font-family: 'Lora', serif; }

.prog-bar { flex: 1; height: 3px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

/* Chain spine */
.chain-list { position: relative; }
.chain-list::before {
  content: '';
  position: absolute;
  left: 13px; top: 14px; bottom: 14px;
  width: 1.5px;
  background: var(--surface2);
  z-index: 0;
}

/* Step row */
.step-row {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  position: relative;
  margin-bottom: 4px;
  user-select: none;
  touch-action: pan-y;
  transition: transform 0.15s ease, opacity 0.15s ease;
}

.step-row.dragging {
  opacity: 0.5;
  z-index: 10;
}

.step-row.drag-over-above::before {
  content: '';
  position: absolute;
  left: 0; right: 0;
  top: -3px;
  height: 2.5px;
  background: var(--accent);
  border-radius: 99px;
  z-index: 20;
}

.step-row.drag-over-below::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  bottom: -3px;
  height: 2.5px;
  background: var(--accent);
  border-radius: 99px;
  z-index: 20;
}

.step-node {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid var(--surface2);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative; z-index: 1;
  transition: all 0.3s ease;
}

.step-node svg { width: 12px; height: 12px; opacity: 0; transition: opacity 0.2s; }

.step-body { flex: 1; padding-bottom: 26px; min-width: 0; }
.step-row:last-child .step-body { padding-bottom: 0; }

.step-name {
  font-size: 0.92rem;
  color: var(--ink3);
  line-height: 1.4;
  padding-top: 4px;
  transition: color 0.3s;
}
.step-note {
  font-size: 0.74rem;
  color: var(--ink3);
  font-family: 'Lora', serif;
  font-style: italic;
  margin-top: 3px;
  opacity: 0.7;
}

/* done */
.step-row.done .step-node { background: var(--accent-soft); border-color: var(--accent-mid); }
.step-row.done .step-node svg { opacity: 1; }
.step-row.done .step-name { color: var(--ink3); text-decoration: line-through; text-decoration-color: rgba(107,95,79,0.35); }
.step-row.done .step-body::before {
  content: '';
  position: absolute;
  left: 13px; top: 0;
  height: calc(100% + 4px);
  width: 1.5px;
  background: var(--accent-mid);
  z-index: 0;
}

/* active */
.step-row.active .step-node { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); cursor: pointer; }
.step-row.active .step-name { color: var(--ink); font-weight: 500; }

/* drag handle */
.drag-handle {
  width: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding-top: 6px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.2s;
  cursor: grab;
  touch-action: none;
}

.drag-handle span {
  display: block;
  width: 14px; height: 1.5px;
  background: var(--ink3);
  border-radius: 99px;
}

.edit-mode .drag-handle { opacity: 1; }
.edit-mode .step-node { pointer-events: none; }
.edit-mode .tap-btn { display: none !important; }
.edit-mode .step-name { color: var(--ink2) !important; font-weight: 400 !important; }

.tap-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding: 7px 16px;
  border-radius: 99px;
  border: none;
  background: var(--accent-soft);
  color: var(--accent);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s ease;
}
.tap-btn:active { transform: scale(0.97); }

/* all done */
.all-done { text-align: center; padding: 2.5rem 1rem; display: none; }
.all-done.show { display: block; }
.all-done-icon { font-size: 1.8rem; margin-bottom: 0.75rem; }
.all-done h2 { font-family: 'Lora', serif; font-size: 1.2rem; font-weight: 400; font-style: italic; color: var(--ink2); margin-bottom: 0.4rem; }
.all-done p { font-size: 0.8rem; color: var(--ink3); }

/* bottom */
.bottom-actions { margin-top: 2rem; display: flex; gap: 8px; flex-wrap: wrap; }

.btn-ghost {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: 99px;
  border: 1px solid rgba(42,33,24,0.13);
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  color: var(--ink3);
  cursor: pointer;
  transition: all 0.18s;
}
.btn-ghost:hover, .btn-ghost.active-btn { background: var(--surface2); color: var(--ink2); }

/* inline edit inputs */
.edit-mode .step-name-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.name-input, .note-input {
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(42,33,24,0.15);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.92rem;
  color: var(--ink);
  padding: 2px 0;
  outline: none;
  width: 100%;
}

.note-input {
  font-size: 0.74rem;
  font-family: 'Lora', serif;
  font-style: italic;
  color: var(--ink2);
}

.name-input:focus, .note-input:focus { border-bottom-color: var(--accent); }

.del-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(42,33,24,0.12);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink3);
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 5px;
  transition: all 0.15s;
}
.del-btn:hover { background: #fdeaea; border-color: #f0b0b0; color: #b43232; }

.add-step-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
  padding-left: 44px;
  display: none;
}
.edit-mode .add-step-row { display: flex; }

.add-step-btn {
  background: transparent;
  border: 1px dashed rgba(42,33,24,0.2);
  border-radius: 99px;
  padding: 6px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  color: var(--ink3);
  cursor: pointer;
  transition: all 0.15s;
}
.add-step-btn:hover { background: var(--surface2); color: var(--ink2); }

@keyframes pop {
  0% { transform: scale(0.5); opacity: 0; }
  65% { transform: scale(1.3); }
  100% { transform: scale(1); opacity: 1; }
}
.popped svg { animation: pop 0.3s ease forwards; }

/* ghost row during drag */
.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  background: var(--surface);
  border-radius: 10px;
  padding: 8px 12px;
  box-shadow: 0 4px 20px rgba(42,33,24,0.15);
  font-size: 0.9rem;
  color: var(--ink2);
  max-width: 280px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border: 1px solid rgba(42,33,24,0.1);
  opacity: 0.95;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">ritme<em>.</em></div>
    <div class="sub" id="dateLabel"></div>
  </header>

  <div class="top-bar">
    <div class="prog-text"><span id="doneCount">0</span> selesai</div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-text" id="totalCount">dari 0</div>
  </div>

  <div class="chain-list" id="chainList"></div>
  <div class="add-step-row" id="addStepRow">
    <button class="add-step-btn" onclick="addStep()">+ tambah langkah</button>
  </div>

  <div class="all-done" id="allDone">
    <div class="all-done-icon">✦</div>
    <h2>hari ini selesai.</h2>
    <p>semua ritme terjaga.</p>
  </div>

  <div class="bottom-actions">
    <button class="btn-ghost" onclick="resetAll()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.35"/></svg>
      ulangi
    </button>
    <button class="btn-ghost" id="editToggleBtn" onclick="toggleEdit()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
      susun ritme
    </button>
  </div>
</div>

<!-- drag ghost -->
<div class="drag-ghost" id="dragGhost" style="display:none"></div>

<script>
const DEFAULTS = [
  { id:'r1',  name:'minum air putih',    note:'satu gelas, pelan-pelan',          done:false },
  { id:'r2',  name:'dzikir pagi',         note:'hadirkan hati',                    done:false },
  { id:'r3',  name:'belajar mandiri',     note:'sesi fokus sebelum dunia berisik', done:false },
  { id:'r4',  name:'siap kuliah',         note:'',                                 done:false },
  { id:'r5',  name:'kuliah',              note:'',                                 done:false },
  { id:'r6',  name:'makan & istirahat',   note:'rebahan dulu gapapa',              done:false },
  { id:'r7',  name:'review catatan',      note:'selagi masih segar',               done:false },
  { id:'r8',  name:'olahraga ringan',     note:'jalan kaki, stretching',           done:false },
  { id:'r9',  name:'skincare',            note:'jangan skip, ini investasi',       done:false },
  { id:'r10', name:'matikan semua notif', note:'dunia bisa menunggu',              done:false },
  { id:'r11', name:"baca Al-Qur'an",      note:'pelan, resapi, biarkan masuk ke hati', done:false },
];

let steps = [];
let editMode = false;

// drag state
let dragIdx = null;
let dragOverIdx = null;
let dragGhostEl = document.getElementById('dragGhost');
let touchStartY = 0;
let touchCurY = 0;

function uid() { return '_' + Math.random().toString(36).substr(2,9); }

function load() {
  try {
    const s = localStorage.getItem('ritme-v1');
    if (s) steps = JSON.parse(s);
    else steps = DEFAULTS.map(d => ({...d}));
  } catch(e) { steps = DEFAULTS.map(d => ({...d})); }
}

function save() { localStorage.setItem('ritme-v1', JSON.stringify(steps)); }

function setDate() {
  const d = new Date();
  const days = ['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  document.getElementById('dateLabel').textContent = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}

function render() {
  const list = document.getElementById('chainList');
  const done = steps.filter(s => s.done).length;
  const total = steps.length;
  const allDone = done === total && total > 0;
  const activeIdx = steps.findIndex(s => !s.done);

  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = 'dari ' + total;
  document.getElementById('progFill').style.width = total ? Math.round(done/total*100)+'%' : '0%';
  document.getElementById('allDone').classList.toggle('show', allDone && !editMode);
  document.getElementById('addStepRow').style.display = editMode ? 'flex' : 'none';

  list.innerHTML = '';
  if (editMode) list.classList.add('edit-mode');
  else list.classList.remove('edit-mode');

  steps.forEach((step, i) => {
    const state = step.done ? 'done' : (i === activeIdx ? 'active' : 'pending');
    const row = document.createElement('div');
    row.className = 'step-row ' + state;
    row.dataset.id = step.id;
    row.dataset.idx = i;

    const checkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="#4A7FA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

    if (editMode) {
      row.innerHTML = `
        <div class="drag-handle" data-idx="${i}">
          <span></span><span></span><span></span>
        </div>
        <div class="step-node"></div>
        <div class="step-body">
          <div class="step-name-wrap">
            <input class="name-input" type="text" value="${esc(step.name)}" data-id="${step.id}" placeholder="nama langkah...">
            <input class="note-input" type="text" value="${esc(step.note)}" data-id="${step.id}-note" placeholder="catatan kecil...">
          </div>
        </div>
        <button class="del-btn" onclick="deleteStep('${step.id}')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      `;
      // touch drag on handle
      const handle = row.querySelector('.drag-handle');
      handle.addEventListener('touchstart', onTouchStart, { passive: false });
    } else {
      const tapBtn = state === 'active'
        ? `<button class="tap-btn" onclick="complete('${step.id}')">
             <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
             selesai
           </button>` : '';
      row.innerHTML = `
        <div class="step-node" id="node-${step.id}" ${state==='active'?`onclick="complete('${step.id}')"`:''}>
          ${checkSvg}
        </div>
        <div class="step-body">
          <div class="step-name">${step.name}</div>
          ${step.note ? `<div class="step-note">${step.note}</div>` : ''}
          ${tapBtn}
        </div>
      `;
    }

    list.appendChild(row);
  });
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function complete(id) {
  const step = steps.find(s => s.id === id);
  if (!step || step.done) return;
  step.done = true;
  save();
  const node = document.getElementById('node-' + id);
  if (node) node.classList.add('popped');
  setTimeout(render, 320);
}

function resetAll() {
  steps.forEach(s => s.done = false);
  save();
  render();
}

function toggleEdit() {
  if (editMode) {
    // save inline edits
    document.querySelectorAll('.name-input').forEach(inp => {
      const step = steps.find(s => s.id === inp.dataset.id);
      if (step) step.name = inp.value.trim() || step.name;
    });
    document.querySelectorAll('.note-input').forEach(inp => {
      const id = inp.dataset.id.replace('-note','');
      const step = steps.find(s => s.id === id);
      if (step) step.note = inp.value.trim();
    });
    steps = steps.filter(s => s.name);
    save();
  }
  editMode = !editMode;
  document.getElementById('editToggleBtn').classList.toggle('active-btn', editMode);
  render();
}

function addStep() {
  // save current edits first
  document.querySelectorAll('.name-input').forEach(inp => {
    const step = steps.find(s => s.id === inp.dataset.id);
    if (step) step.name = inp.value.trim() || step.name;
  });
  document.querySelectorAll('.note-input').forEach(inp => {
    const id = inp.dataset.id.replace('-note','');
    const step = steps.find(s => s.id === id);
    if (step) step.note = inp.value.trim();
  });
  steps.push({ id: uid(), name: '', note: '', done: false });
  render();
  // focus last name input
  const inputs = document.querySelectorAll('.name-input');
  if (inputs.length) inputs[inputs.length-1].focus();
}

function deleteStep(id) {
  steps = steps.filter(s => s.id !== id);
  render();
}

// ── Touch drag-to-reorder ──────────────────────────────────────────

function onTouchStart(e) {
  const handle = e.currentTarget;
  dragIdx = parseInt(handle.dataset.idx);
  touchStartY = e.touches[0].clientY;
  touchCurY = touchStartY;

  const row = handle.closest('.step-row');
  dragGhostEl.textContent = steps[dragIdx].name || '—';
  dragGhostEl.style.display = 'block';
  positionGhost(touchStartY);

  row.classList.add('dragging');

  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend', onTouchEnd);
}

function onTouchMove(e) {
  e.preventDefault();
  touchCurY = e.touches[0].clientY;
  positionGhost(touchCurY);

  // find which row we're hovering over
  const rows = document.querySelectorAll('.step-row');
  let newOver = null;
  let isAbove = false;

  rows.forEach((row, i) => {
    const rect = row.getBoundingClientRect();
    const mid = rect.top + rect.height / 2;
    if (touchCurY >= rect.top && touchCurY <= rect.bottom) {
      newOver = i;
      isAbove = touchCurY < mid;
    }
  });

  rows.forEach(r => { r.classList.remove('drag-over-above', 'drag-over-below'); });

  if (newOver !== null && newOver !== dragIdx) {
    dragOverIdx = newOver;
    rows[newOver].classList.add(isAbove ? 'drag-over-above' : 'drag-over-below');
  } else {
    dragOverIdx = null;
  }
}

function onTouchEnd() {
  document.removeEventListener('touchmove', onTouchMove);
  document.removeEventListener('touchend', onTouchEnd);

  dragGhostEl.style.display = 'none';

  const rows = document.querySelectorAll('.step-row');
  rows.forEach(r => r.classList.remove('dragging', 'drag-over-above', 'drag-over-below'));

  if (dragOverIdx !== null && dragOverIdx !== dragIdx) {
    // save current edits before reorder
    document.querySelectorAll('.name-input').forEach(inp => {
      const step = steps.find(s => s.id === inp.dataset.id);
      if (step) step.name = inp.value.trim() || step.name;
    });
    document.querySelectorAll('.note-input').forEach(inp => {
      const id = inp.dataset.id.replace('-note','');
      const step = steps.find(s => s.id === id);
      if (step) step.note = inp.value.trim();
    });

    const moved = steps.splice(dragIdx, 1)[0];
    let insertAt = dragOverIdx > dragIdx ? dragOverIdx : dragOverIdx;
    if (dragOverIdx > dragIdx) insertAt = dragOverIdx;
    else insertAt = dragOverIdx;
    steps.splice(insertAt, 0, moved);
    save();
  }

  dragIdx = null;
  dragOverIdx = null;
  render();
}

function positionGhost(y) {
  dragGhostEl.style.top = (y - 20) + 'px';
  dragGhostEl.style.left = '50%';
  dragGhostEl.style.transform = 'translateX(-50%)';
}

// init
load();
setDate();
render();
</script>
</body>
</html>
